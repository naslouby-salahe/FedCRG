[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcrg"
version = "0.2.0"
description = "Evidence-admitted calibration readiness for client-specific thresholding in federated IoT anomaly detection"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Salaheddine Naslouby"}]
dependencies = [
  "click>=8.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyarrow>=15.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "nox>=2024.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "pyright>=1.1.350",
  "ruff>=0.6",
]

[project.scripts]
fedcrg = "fedcrg.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["fedcrg"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src/fedcrg"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
