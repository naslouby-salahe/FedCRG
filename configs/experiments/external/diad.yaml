id: external_diad
protocol: ../../protocol/default.yaml
dataset: ../../datasets/diad.yaml
detector: ../../detectors/autoencoder_diad.yaml
training:
  rounds: 30
  local_epochs: 20
  batch_size: 64
  optimizer: adam
  learning_rate_initial: 0.001
  learning_rate_final: 0.00001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 0.00000001
  weight_decay: 0.0
  client_fraction: 1.0
  aggregation: equal_client_mean
  mixed_precision: false
  early_stopping: false
  deterministic_algorithms: true
  record_round20_score_correlation: true
  device: cpu
policies:
  - REF-Q99-R
  - GLOBAL-Q99-FULL
  - LOCAL-Q99-FULL
  - GATE-A-ONLY
  - GATE-B-ONLY
  - SHRINKAGE
  - FEDDETECT-3SIGMA
  - DEV-F1-LG-SELECT
  - LARIDI-STYLE-SS
  - SUP-F1-1000
  - ORACLE-TEST
  - FEDCRG
outputs_root: outputs
