id: external_diad
protocol: ../../protocol/default.yaml
dataset: ../../datasets/diad.yaml
detector: ../../detectors/autoencoder_diad.yaml
training:
  rounds: 30
  local_epochs: 20
  batch_size: 64
  optimizer: adam
  learning_rate_initial: 0.001
  learning_rate_final: 0.00001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 0.00000001
  weight_decay: 0.0
  client_fraction: 1.0
  aggregation: equal_client_mean
  mixed_precision: false
  device: cpu
policies:
  - reference_quantile
  - global_quantile
  - local_quantile
  - readiness_only
  - mismatch_only
  - shrinkage
  - three_sigma
  - dev_f1_select
  - summary_statistic_select
  - supervised_f1
  - oracle_test
  - fedcrg
outputs_root: outputs
