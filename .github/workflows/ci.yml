name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-build --no-install-project --extra dev
      - run: uv build --wheel -o dist
      - run: |
          wheel=$(ls dist/*.whl)
          hash=$(sha256sum "$wheel" | cut -d' ' -f1)
          echo "$wheel --hash=sha256:$hash" > dist/wheel-requirements.txt
      - run: uv pip install --no-build --require-hashes --no-deps -r dist/wheel-requirements.txt
      - name: Format check
        run: uv run --no-sync --no-build ruff format --check src tests
      - name: Lint
        run: uv run --no-sync --no-build ruff check src tests
      - name: Type check
        run: uv run --no-sync --no-build pyright src/fedcrg
      - name: Repository audit
        run: uv run --no-sync --no-build python tools/audit_repository.py
      - name: Tests (parallel)
        run: uv run --no-sync --no-build pytest -n auto --cov=fedcrg --cov-report=term-missing --cov-report=xml
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
